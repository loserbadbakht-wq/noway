name: omg

on:
  workflow_dispatch: 
jobs:
  build:
    name: Run

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo add-apt-repository ppa:tomtomtom/yt-dlp
        sudo apt update
        sudo apt install yt-dlp
        sudo apt install ffmpeg
        pip install -q -U bgutil-ytdlp-pot-provider
          git clone --depth 1 --branch 1.3.1 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            /tmp/bgutil
          cd /tmp/bgutil/server && npm ci && npx tsc
        
    
    - name: Fetch latest video URL from RSS feed
      id: fetch_video
      run: |
          # Use curl to get the RSS feed, extract the first entry's video link
          LATEST_URL=$(curl -s "https://www.youtube.com/feeds/videos.xml?channel_id=UCAVR6Q0YgYa8xwz8rdg9Mrg" \
            | awk '/<entry>/{flag=1; next} flag && /<link rel="alternate" href="/{match($0, /href="([^"]*)"/, a); print a[1]; exit}')
          
          echo "Latest video URL: $LATEST_URL"
          echo "video_url=$LATEST_URL" >> $GITHUB_OUTPUT
    
    - name: Create Firefox profile at fixed path
      run: |
        mkdir -p ${{ runner.temp }}/my_profile
        firefox -profile ${{ runner.temp }}/my_profile --headless &
        sleep 5
        pkill -f "firefox.*my_profile" || true
        echo "Cookie path: ${{ runner.temp }}/my_profile/cookies.sqlite"
    
