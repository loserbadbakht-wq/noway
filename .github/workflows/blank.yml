name: omg

on:
  workflow_dispatch: 
jobs:
  build:
    name: Run

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup yt-dlp
      uses: AnimMouse/setup-yt-dlp@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install git-lfs
        git lfs install
        git lfs track "*.webm" "*.mp4"   # adjust extensions as needed
        git add .gitattributes
        pip install -q -U bgutil-ytdlp-pot-provider
        git clone --depth 1 --branch 1.3.1 \
        https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
        /tmp/bgutil
        cd /tmp/bgutil/server && npm ci && npx tsc
        
    - name: Start PO Token provider server
      run: |
        node /tmp/bgutil/server/build/main.js &
        sleep 5
    - name: Fetch latest non-Short video URL
      id: fetch_video
      run: |
          FEED=$(curl -s "https://www.youtube.com/feeds/videos.xml?channel_id=UCAVR6Q0YgYa8xwz8rdg9Mrg")
          LATEST_URL=$(echo "$FEED" \
            | grep -o 'href="[^"]*"' \
            | sed 's/href="//;s/"//' \
            | grep "/watch?v=" \
            | grep -v "/shorts/" \
            | head -1)

          if [[ -z "$LATEST_URL" ]]; then
            echo "No regular video found (feed empty or all are Shorts)."
            echo "video_url=" >> $GITHUB_OUTPUT
          else
            echo "Latest regular video URL: $LATEST_URL"
            echo "video_url=$LATEST_URL" >> $GITHUB_OUTPUT
          fi
    
    - name: Write cookies.txt from secret
      run: |
        printf '%s' "${{ secrets.COOKIES }}" > /tmp/cookies.txt
    
    - name: Check cookies.txt format
      run: |
       head -3 /tmp/cookies.txt
       echo "---"
       wc -l /tmp/cookies.txt
    - name: Download latest genshin jp video
      run: |
        yt-dlp \
        -o "%(channel)s/%(upload_date)s - %(title)s.%(ext)s" \
        --no-overwrites \
        -f "bv*[height<=720][vcodec!*=av01]+ba / b[height<=720][vcodec!*=av01]" \
        --write-subs \
        --sub-lang en \
        --sub-format srt \
        --write-auto-subs \
        --embed-subs \
        --cookies /tmp/cookies.txt \
        "${{ steps.fetch_video.outputs.video_url }}"
    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Add and commit changes
      id: commit
      run: |
        git add -A
        if git diff --staged --quiet; then
         echo "No changes to commit"
         echo "changed=false" >> $GITHUB_OUTPUT
        else
         git commit -m "Add latest Genshin video [skip ci]"
         echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Push changes
      if: steps.commit.outputs.changed == 'true'
      run: |
        git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
