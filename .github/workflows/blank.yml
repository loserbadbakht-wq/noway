name: omg

on:
  workflow_dispatch: 
jobs:
  build:
    name: Run

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo add-apt-repository ppa:tomtomtom/yt-dlp
        sudo apt update
        sudo apt install yt-dlp
        sudo apt install ffmpeg
