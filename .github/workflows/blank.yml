name: omg

on:
  workflow_dispatch: 
jobs:
  build:
    name: Run

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get install -y ffmpeg
        pip install -q -U "yt-dlp[default]" bgutil-ytdlp-pot-provider
        git clone --depth 1 --branch 1.3.1 \
        https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
        /tmp/bgutil
        cd /tmp/bgutil/server && npm ci && npx tsc
        
    - name: Start PO Token provider server
      run: |
        node /tmp/bgutil/server/build/main.js &
        sleep 5
    - name: Fetch latest video URL from RSS feed
      id: fetch_video
      run: |
          # Use curl to get the RSS feed, extract the first entry's video link
          LATEST_URL=$(curl -s "https://www.youtube.com/feeds/videos.xml?channel_id=UCAVR6Q0YgYa8xwz8rdg9Mrg" \
            | awk '/<entry>/{flag=1; next} flag && /<link rel="alternate" href="/{match($0, /href="([^"]*)"/, a); print a[1]; exit}')
          
          echo "Latest video URL: $LATEST_URL"
          echo "video_url=$LATEST_URL" >> $GITHUB_OUTPUT
    
    
    - name: Write cookies.txt from secret
      run: |
        printf '%s' "${{ secrets.COOKIES }}" > /tmp/cookies.txt
    
    - name: Check cookies.txt format
      run: |
       head -3 /tmp/cookies.txt
       echo "---"
       wc -l /tmp/cookies.txt
    - name: Download latest genshin jp video
      run: |
        yt-dlp \
        -o "%(channel)s/%(upload_date)s - %(title)s.%(ext)s" \
        --merge-output-format webm \
        --no-overwrites \
        -f "bestvideo[codec~=vp9][height<=720]+bestaudio[codec~=opus]/bestvideo[codec~=vp9][height<=720]+bestaudio/best" \
        --write-subs \
        --sub-lang en \
        --sub-format srt \
        --write-auto-subs \
        --cookies /tmp/cookies.txt \
        "${{ steps.fetch_video.outputs.video_url }}"
