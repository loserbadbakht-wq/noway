name: input
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL'
        required: true
        type: string
jobs:
  build:
    name: Run

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup yt-dlp
      uses: AnimMouse/setup-yt-dlp@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install git-lfs
        git lfs install
        git lfs track "*.webm" "*.mp4"   # adjust extensions as needed
        git add .gitattributes
        pip install -q -U bgutil-ytdlp-pot-provider
        git clone --depth 1 --branch 1.3.1 \
        https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
        /tmp/bgutil
        cd /tmp/bgutil/server && npm ci && npx tsc
        
    - name: Start PO Token provider server
      run: |
        node /tmp/bgutil/server/build/main.js &
        sleep 5
    
    - name: Write cookies.txt from secret
      run: |
        printf '%s' "${{ secrets.COOKIES }}" > /tmp/cookies.txt
    
    - name: Check cookies.txt format
      run: |
       head -3 /tmp/cookies.txt
       echo "---"
       wc -l /tmp/cookies.txt
    - name: Download latest genshin jp video
      id: download
      run: |
        START_TIME=$(date +%s)
        echo "start_time=$START_TIME" >> $GITHUB_OUTPUT
        yt-dlp \
        -o "%(channel)s/%(upload_date)s - %(title)s.%(ext)s" \
        --no-overwrites \
        -f "bv*[height<=720][vcodec!*=av01]+ba / b[height<=720][vcodec!*=av01]" \
        --write-subs \
        --sub-lang en \
        --write-auto-subs \
        --embed-subs \
        --cookies /tmp/cookies.txt \
        "${{ github.event.inputs.video_url }}"
    - name: Find video file path
      id: find_video
      run: |
        START_TIME=${{ steps.download.outputs.start_time }}
        VIDEO=$(find . \( -name "*.webm" -o -name "*.mp4" \) -newermt "@$START_TIME" -type f | head -n 1)
        if [ -z "$VIDEO" ]; then
          echo "No new video downloaded – skipping FFmpeg"
          echo "video_path=" >> $GITHUB_OUTPUT
        else
          echo "video_path=$VIDEO" >> $GITHUB_OUTPUT
        fi
    
    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Add and commit changes
      id: commit
      run: |
        git add -A
        if git diff --staged --quiet; then
         echo "No changes to commit"
         echo "changed=false" >> $GITHUB_OUTPUT
        else
         git commit -m "Add latest Genshin video [skip ci]"
         echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Push changes
      if: steps.commit.outputs.changed == 'true'
      run: |
        git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
