name: Get Latest Non-Short YouTube Video

on:
  workflow_dispatch:

jobs:
  get-latest-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch latest non-Short video URL
        id: fetch_video
        run: |
          FEED=$(curl -s "https://www.youtube.com/feeds/videos.xml?channel_id=UCAVR6Q0YgYa8xwz8rdg9Mrg")

          # Extract all hrefs, keep only those with "/watch?v=" (real videos),
          # exclude shorts, and take the first one (most recent).
          LATEST_URL=$(echo "$FEED" \
            | grep -o 'href="[^"]*"' \
            | sed 's/href="//;s/"//' \
            | grep "/watch?v=" \
            | grep -v "/shorts/" \
            | head -1)

          if [[ -z "$LATEST_URL" ]]; then
            echo "No regular video found (feed empty or all are Shorts)."
            echo "video_url=" >> $GITHUB_OUTPUT
          else
            echo "Latest regular video URL: $LATEST_URL"
            echo "video_url=$LATEST_URL" >> $GITHUB_OUTPUT
          fi

      - name: Use the video URL
        run: |
          if [ -z "${{ steps.fetch_video.outputs.video_url }}" ]; then
            echo "No regular video available – skipping further actions."
          else
            echo "Regular video URL: ${{ steps.fetch_video.outputs.video_url }}"
          fi
